apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: random-app
  template:
    metadata:
      labels:
        app: random-app
    spec:
      containers:
      - name: app
        image: yuriysherbakov/hw24-random:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: random-app
spec:
  type: NodePort
  selector:
    app: random-app
  ports:
  - port: 8082
    targetPort: 8082
    nodePort: 30080
